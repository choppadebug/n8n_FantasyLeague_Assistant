services:
  n8n:
    # n8n 2.46.6: exact image used by the existing installation.
    image: n8nio/n8n@sha256:8602f5dfacbe2c931eeafd010de0e68182310e9f309921e780ab69182e92b3ae
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      TZ: Europe/Rome
      GENERIC_TIMEZONE: Europe/Rome
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - type: bind
        source: ${N8N_DATA_DIR:-./n8n-data}
        target: /home/node/.n8n
        bind:
          create_host_path: false
      - type: bind
        source: ${N8N_FILES_DIR:-./files}
        target: /files
        read_only: true
        bind:
          create_host_path: false
